name: Push OTA Update (Shorebird)

on:
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: driver_app

    steps:
    - uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Set up Shorebird
      uses: shorebirdtech/setup-shorebird@v1

    - name: Install Dependencies
      run: flutter pub get

    - name: Push Shorebird Patch
      env:
        SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
      run: shorebird patch android --force
