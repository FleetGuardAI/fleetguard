name: PostgreSQL Security & Concurrency Verification

on:
  pull_request:
    branches: [ develop, main ]
    paths:
      - 'backend/**'
      - '.github/workflows/security-db-verify.yml'
  workflow_dispatch:

jobs:
  postgres-security-verification:
    name: Ephemeral PostgreSQL Security & Concurrency Verification
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: fleetguard_ci_test
          POSTGRES_USER: test_runner
          POSTGRES_PASSWORD: test_secure_password_1234
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Application & Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio asyncpg psycopg2-binary cryptography

      - name: Generate Temporary Test-Only Secrets
        id: secrets
        run: |
          # Generate cryptographically secure ephemeral 256-bit secrets for CI verification
          OTP_KEY=$(python -c "import secrets; print(secrets.token_hex(32))")
          ADMIN_KEY=$(python -c "import secrets; print(secrets.token_hex(32))")
          APP_KEY=$(python -c "import secrets; print(secrets.token_hex(32))")
          FIELD_KEY=$(python -c "import secrets; print(secrets.token_hex(32))")
          echo "::add-mask::$OTP_KEY"
          echo "::add-mask::$ADMIN_KEY"
          echo "::add-mask::$APP_KEY"
          echo "::add-mask::$FIELD_KEY"
          echo "OTP_RECIPIENT_FINGERPRINT_KEY=$OTP_KEY" >> $GITHUB_ENV
          echo "ADMIN_JWT_SECRET=$ADMIN_KEY" >> $GITHUB_ENV
          echo "SECRET_KEY=$APP_KEY" >> $GITHUB_ENV
          echo "FIELD_ENCRYPTION_KEY=$FIELD_KEY" >> $GITHUB_ENV
          echo "DATABASE_URL=postgresql+asyncpg://test_runner:test_secure_password_1234@localhost:5432/fleetguard_ci_test" >> $GITHUB_ENV
          echo "POSTGRES_TEST_URL=postgresql+asyncpg://test_runner:test_secure_password_1234@localhost:5432/fleetguard_ci_test" >> $GITHUB_ENV
          echo "SYNC_DATABASE_URL=postgresql://test_runner:test_secure_password_1234@localhost:5432/fleetguard_ci_test" >> $GITHUB_ENV

      - name: Run Alembic Upgrade Head (Clean DB)
        run: |
          echo "Running initial Alembic migration against empty PostgreSQL container..."
          alembic upgrade head

      - name: Verify PostgreSQL Schema, Indexing & Atomic Concurrency Suite
        run: |
          echo "Executing isolated PostgreSQL security verification suite..."
          python -m pytest tests/security/test_postgres_verification.py -v --junitxml=junit-postgres-concurrency.xml

      - name: Test Migration Downgrade on Disposable Database
        run: |
          echo "Verifying migration downgrade to e5b6c7d8a9f0 (drops RLS policies)..."
          alembic downgrade e5b6c7d8a9f0
          # Verify RLS policies were cleanly dropped
          python -c "
          import asyncio
          from sqlalchemy.ext.asyncio import create_async_engine
          from sqlalchemy import text
          async def check_rls_dropped():
              engine = create_async_engine('$DATABASE_URL')
              async with engine.connect() as conn:
                  res = await conn.execute(text(\"\"\"
                      SELECT count(*) FROM pg_policies
                      WHERE policyname LIKE '%tenant_isolation_policy';
                  \"\"\"))
                  count = res.scalar()
                  assert count == 0, f'Tenant isolation policies still exist after downgrade: {count}'
                  print('Downgrade verification successful: RLS policies dropped.')
              await engine.dispose()
          asyncio.run(check_rls_dropped())
          "

          echo "Verifying migration downgrade to f1a2b3c4d5e6 (drops otp_transactions)..."
          alembic downgrade f1a2b3c4d5e6
          # Verify table was cleanly dropped
          python -c "
          import asyncio
          from sqlalchemy.ext.asyncio import create_async_engine
          from sqlalchemy import text
          async def check_otp_dropped():
              engine = create_async_engine('$DATABASE_URL')
              async with engine.connect() as conn:
                  res = await conn.execute(text(\"\"\"
                      SELECT EXISTS (
                          SELECT FROM information_schema.tables
                          WHERE table_name = 'otp_transactions'
                      );
                  \"\"\"))
                  exists = res.scalar()
                  assert not exists, 'Table otp_transactions still exists after downgrade!'
                  print('Downgrade verification successful: otp_transactions table dropped.')
              await engine.dispose()
          asyncio.run(check_otp_dropped())
          "

      - name: Restore Schema with Subsequent Upgrade
        run: |
          echo "Re-applying upgrade head to restore schema..."
          alembic upgrade head
          # Verify table, indexes, and RLS policies were cleanly restored
          python -c "
          import asyncio
          from sqlalchemy.ext.asyncio import create_async_engine
          from sqlalchemy import text
          async def check_restored():
              engine = create_async_engine('$DATABASE_URL')
              async with engine.connect() as conn:
                  res = await conn.execute(text(\"\"\"
                      SELECT count(*) FROM information_schema.tables
                      WHERE table_name = 'otp_transactions';
                  \"\"\"))
                  count = res.scalar()
                  assert count == 1, 'Table otp_transactions was not restored after upgrade!'

                  res_rls = await conn.execute(text(\"\"\"
                      SELECT count(*) FROM pg_policies
                      WHERE policyname LIKE '%tenant_isolation_policy';
                  \"\"\"))
                  rls_count = res_rls.scalar()
                  assert rls_count > 0, 'RLS policies were not restored after upgrade!'
                  print(f'Re-upgrade verification successful: otp_transactions and {rls_count} RLS policies restored.')
              await engine.dispose()
          asyncio.run(check_restored())
          "

      - name: Run Full Security Test Suite Against PostgreSQL
        run: |
          echo "Executing full Phase B security test suite..."
          python -m pytest tests/security/ -v --junitxml=junit-full-security.xml

      - name: Export CI Test Results Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: postgres-security-verification-results
          path: |
            backend/junit-postgres-concurrency.xml
            backend/junit-full-security.xml
