name: fleetguard_driver
description: FleetGuard Driver - Fleet Management Driver Application
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # Networking
  dio: ^5.4.0
  web_socket_channel: ^2.4.0
  connectivity_plus: ^5.0.2

  # Routing
  go_router: ^13.0.0

  # Maps (OSM - free, no API key needed)
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  url_launcher: ^6.2.2

  # Location
  geolocator: ^11.0.0
  flutter_background_service: ^5.0.5
  flutter_background_service_android: ^6.2.3

  # Camera & Media
  image_picker: ^1.0.7
  camera: ^0.10.5+9

  # QR Code
  mobile_scanner: ^4.0.1
  qr_flutter: ^4.1.0

  # Storage
  flutter_secure_storage: ^9.0.0
  sqflite: ^2.3.2
  path_provider: ^2.1.2
  path: ^1.8.3

  # UI
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  shimmer: ^3.0.0
  cached_network_image: ^3.3.1
  fl_chart: ^0.66.0
  signature_pad: ^4.1.0
  lottie: ^3.0.0

  # Notifications (local - no Firebase needed for demo)
  flutter_local_notifications: ^17.0.0

  # Permissions
  permission_handler: ^11.2.0

  # Utils
  intl: ^0.19.0
  uuid: ^4.2.2
  json_annotation: ^4.8.1
  freezed_annotation: ^2.4.1
  equatable: ^2.0.5
  logger: ^2.0.2+1

  # Security
  flutter_jailbreak_detection: ^1.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.8
  json_serializable: ^6.7.1
  freezed: ^2.4.6
  riverpod_generator: ^2.3.9
  mockito: ^5.4.4
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
